<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quetta Cafe - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation Bar -->
    <header>
        <h1>Quetta Cafe / Dhaba</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2>Contact Us</h2>

        <!-- Cafe Info Section -->
        <div style="text-align: center; margin-bottom: 30px;">
            <h3>Opening Hours</h3>
            <p>Monday - Sunday: 6:00 AM – 2:00 AM</p>

            <h3>Location Address</h3>
            <p>Quetta Cafe &amp; Dhaba, Main Commercial Area, Islamabad, Pakistan</p>
        </div>

        <hr style="border: 1px solid white; margin-bottom: 30px;">

        <!-- Contact Form -->
        <form id="contactForm" onsubmit="handleContactSubmit(event)">
            <p style="text-align: center; font-weight: bold;">Send Us a Message</p>
            
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required style="width: 100%; padding: 8px; margin: 8px 0 16px; background-color: black; color: white; border: 1px solid white;"><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin: 8px 0 16px; background-color: black; color: white; border: 1px solid white;"><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 8px; margin: 8px 0 16px; background-color: black; color: white; border: 1px solid white;"></textarea><br>

            <div style="text-align: center;">
                <button type="submit">Submit</button>
            </div>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Quetta Cafe | Developed by Awais (26i-3271)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
